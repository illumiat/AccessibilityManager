plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.accessibilitymanager'
    // 规范落地基线要求 compileSdk 35（material3 1.5.0-alpha18 的 AAR 元数据）。
    compileSdk 35

    defaultConfig {
        applicationId "com.accessibilitymanager"
        minSdk 24
        // targetSdk 保持 33：保活链路（前台服务/广播注册）不触碰平台行为变更。
        targetSdk 33
        versionCode 15
        versionName "1.2.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        // Compose 为新增：UI 层迁 Compose；业务层已全量 Kotlin 化，
        // 仅 HomeFragment.java 因承载 View 写入路径而保留 Java。
        compose true
        // 设置页页脚要显示真实版本号：由 BuildConfig.VERSION_NAME 派生，
        // 而不是硬编码字面量（原先硬编码的 "v9.0" 与包内 versionName 长期不符）。
        buildConfig true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    // 设计系统骨架（token + 组件外观），以 api 暴露 material3/ui/foundation。
    implementation project(':core:designsystem')

    // 核心逻辑回归测试（设置串纯函数：历史缺陷 M1/M2 的判定面）。
    // 口径与 :core:designsystem 一致。
    testImplementation libs.junit

    // 过渡期保留：XML 主题属性是主题切换（setTheme）的载体，Compose 侧与 View 侧共用同一份配色。
    // 全部页面迁移完成后应移除。
    implementation libs.material
    implementation libs.work.runtime
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
}

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.accessibilitymanager'
    // 规范落地基线要求 compileSdk 35（material3 1.5.0-alpha18 的 AAR 元数据）。
    compileSdk 35

    defaultConfig {
        applicationId "com.accessibilitymanager"
        minSdk 24
        // targetSdk 定在 Android 10（API 29）：**不往高走**。理由是保活链：
        //   targetSdk >= 31 → Android 12+ 前台服务启动限制（ForegroundServiceStartNotAllowedException）
        //   targetSdk >= 33 → 通知权限需运行时申请（漏申请就拉不起前台服务）
        //   targetSdk >= 34 → 必须声明 foregroundServiceType
        // 本应用是自分发（GitHub Release），**没有上架门槛要求 targetSdk 够新**，
        // 故取 29 让上述限制全部不生效 —— 保活链不必与平台限制对抗。
        // compileSdk 35 只影响编译期 API 可见性，与运行期行为限制无关。
        targetSdk 29
        versionCode 18
        versionName "1.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        // Compose 为新增：UI 层迁 Compose；业务层已全量 Kotlin 化，
        // 仅 HomeFragment.java 因承载 View 写入路径而保留 Java。
        compose true
        // 设置页页脚要显示真实版本号：由 BuildConfig.VERSION_NAME 派生，
        // 而不是硬编码字面量（原先硬编码的 "v9.0" 与包内 versionName 长期不符）。
        buildConfig true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    // 设计系统骨架（token + 组件外观），以 api 暴露 material3/ui/foundation。
    implementation project(':core:designsystem')

    // 核心逻辑回归测试（设置串纯函数：历史缺陷 M1/M2 的判定面）。
    // 口径与 :core:designsystem 一致。
    testImplementation libs.junit

    // 过渡期保留：XML 主题属性是主题切换（setTheme）的载体，Compose 侧与 View 侧共用同一份配色。
    // 全部页面迁移完成后应移除。
    implementation libs.material
    implementation libs.work.runtime
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
}

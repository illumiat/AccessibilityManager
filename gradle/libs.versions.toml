[versions]
# AGP：规范基线要求 material3 / compose 各构件的 AAR 元数据 minAndroidGradlePluginVersion = 8.6.0。
# 本仓库既有工具链为 8.7.3（>= 8.6.0），满足要求，保持不动以免扰动已验证的构建链。
agp = "8.7.3"
# Kotlin 必须 >= 2.1.20：compose 1.11.0-beta02 与 material3 1.5.0-alpha18 的 POM 均声明 kotlin-stdlib 2.1.20。
kotlin = "2.1.20"

coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.6.1"
window = "1.3.0"
junit = "4.13.2"

# ── Compose 版本选择（一手核实结论，勿凭印象改）─────────────────────────────
# **不使用 compose BOM**：所有 BOM 都 把 material3 钉在 1.4.0，而 1.4.0 中
# `MaterialExpressiveTheme` 与 `MotionScheme.expressive()` 是 Kotlin internal（已解官方 sources.jar 确认），
# 应用代码调不到；且 BOM 的约束无法覆盖。故各构件显式钉版本。
# material3 1.5.0-alpha18 = 「Expressive API 已公开」与「compileSdk 35 + AGP 8.6.0」的最高交集；
# alpha19 起要求 compileSdk 37 + AGP 9.1.0，超出当前工具链。
# Expressive API 在 1.5.x 带 @ExperimentalMaterial3ExpressiveApi，使用处需 @OptIn。
material3 = "1.5.0-alpha18"
compose = "1.11.0-beta02"
# 官方 Material 图标集：MD3 NavigationBar 需要 filled(选中)/outlined(未选中) 两态图标。
# 1.7.8 只提供 ImageVector 数据、API 面极小，与 compose 1.11.0-beta02 混用无兼容问题（Gradle 取高版本）。
materialIcons = "1.7.8"

# ── 存量依赖（迁移过渡期保留）──────────────────────────────────────────────
# material（View 体系，MDC）在过渡期仍被引用：XML 主题属性、主题切换（setTheme）与尚未迁移的 View 布局，
# 以及设计系统读取主题属性所需的 colorSurfaceContainer* 全档属性（1.13.0 缺 lowest 档）。
# 1.14.0 是 Views 库终版（维护模式，签名不再变），要求 AGP 8.7.3+ 与 minSdk 23 —— 本仓库均满足。
# 迁移完成后应移除——规范 §10 明确 MDC 非落点。
material = "1.14.0"
work = "2.9.1"
shizuku = "13.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }

# Compose 各构件显式钉版本（见上方说明，不用 BOM）
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# 过渡期：View 体系（MDC）——主题属性解析 + 尚未迁移的 XML 布局 + 配色算法生成。
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.x 起 compose 编译器以独立 Gradle 插件形式提供，版本跟随 Kotlin。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
